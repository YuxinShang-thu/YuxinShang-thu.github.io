<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__name" href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {%- for link in site.data.navigation.main %}
        {%- if link.url contains "://" %}
        <li><a href="{{ link.url }}">{{ link.title }}</a></li>
        {%- else %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {%- endif %}
        {%- endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch between light and dark theme" hidden>
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
