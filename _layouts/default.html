<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{%- if page.lens_figure %}
<script src="{{ '/assets/js/lens.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
{%- endif %}
</body>
</html>
