# Site settings. Jekyll does not reload this file while `jekyll serve` is
# running, so restart the server after changing it.

title       : "Yuxin Shang"
tagline     : "Ph.D. student in astronomy at The Ohio State University"
description : "Yuxin Shang is a Ph.D. student in astronomy at The Ohio State University, working on gravitational microlensing and weak lensing."
locale      : "en-US"
url         : https://YuxinShang-thu.github.io
baseurl     : ""
repository  : "YuxinShang-thu/YuxinShang-thu.github.io"

# Shown in the page header, the home page and the footer. Leave a line blank
# to hide that link.
author:
  name          : "Yuxin Shang"
  avatar        : "profile-portrait.jpg"   # in /images/
  bio           : "B.S. in mathematics and physics, THU, 2026; Ph.D. in astronomy, OSU, ongoing"
  employer      : "The Ohio State University, Dept. of Astronomy"
  employer_url  : "https://astronomy.osu.edu"
  location      : "4014 McPherson Lab"
  email         : "shang.327@osu.edu"
  googlescholar : "https://scholar.google.com/citations?hl=en&user=-IRk7oIAAAAJ"
  orcid         : "https://orcid.org/0009-0005-0410-8451"
  github        : "https://github.com/YuxinShang-thu"
  researchgate  : "https://www.researchgate.net/scientific-contributions/Yuxin-Shang-2325475306"
  blog          : "https://outputasinterest.blogspot.com"
  arxiv         :   # link to your arXiv author page
  ads           :   # link to your NASA ADS library
  linkedin      :   # full URL
  bluesky       :   # full URL

# Headings on the Publications page. Each publication's `category` picks one.
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Content
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

# Build
include:
  - _pages
  - files
exclude:
  - .bundle
  - .sass-cache
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - _config_docker.yml
  - docker-compose.yaml
  - local
  - markdown_generator
  - node_modules
  - scripts
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - vendor
encoding          : "utf-8"
timezone          : Etc/UTC
future            : false
permalink         : /:categories/:title/
excerpt_separator : "\n\n"

markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
